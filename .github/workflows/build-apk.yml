name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'وسم الإصدار (Release Tag)'
        required: false
        default: 'v1.0.0'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: Compile Web Application
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Modern Android SDK Components & Accept Licenses
        run: |
          # Set canonical Android SDK paths
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          # Locate sdkmanager (preferring latest cmdline-tools)
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "Configuring Android SDK via: $SDKMANAGER"
            # Accept all licenses initially
            yes | "$SDKMANAGER" --licenses || true

            # Install explicit modern components (replaces deprecated legacy 'tools')
            echo "Installing modern Android SDK components: cmdline-tools;latest, platform-tools, platforms;android-35, build-tools;35.0.0..."
            "$SDKMANAGER" --install \
              "cmdline-tools;latest" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0" || true

            # Accept any newly introduced licenses
            yes | "$SDKMANAGER" --licenses || true
          else
            echo "Warning: sdkmanager not found on expected paths, using preinstalled runner SDK"
          fi

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/Dazai-Sparks-v1.0.apk
            echo "Successfully generated APK: build-output/Dazai-Sparks-v1.0.apk"
          else
            echo "Error: APK file could not be found"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dazai-Sparks-Android-APK
          path: build-output/Dazai-Sparks-v1.0.apk
          retention-days: 30
